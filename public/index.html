<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Song Lyrics Downloader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151c2c;
      --card-hover: #1e293b;
      --accent: #6366f1;
      --text: #f8fafc;
      --text-dim: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem;
    }
    .wrapper { width: 100%; max-width: 900px; }
    header { text-align: center; margin: 1.5rem 0 2rem; }
    header h1 { font-size: 2.2rem; font-weight: 700; color: #fff; margin-bottom: 0.3rem; }
    header p { color: var(--text-dim); font-size: 0.95rem; }

    .search-box {
      display: flex;
      gap: 0.5rem;
      background: var(--card-bg);
      padding: 0.4rem 0.5rem;
      border-radius: 50px;
      border: 1px solid #2d3748;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      margin-bottom: 2rem;
    }
    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      padding: 0.8rem 1.2rem;
      font-size: 1rem;
    }
    .search-box button {
      background: var(--accent);
      color: #fff;
      border: none;
      outline: none;
      padding: 0.8rem 1.8rem;
      border-radius: 50px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .search-box button:hover { opacity: 0.9; }

    .status-box { text-align: center; color: var(--text-dim); font-size: 1.1rem; margin: 2rem 0; display: none; }

    /* Results Grid */
    .tracks-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1.2rem;
      margin-bottom: 3rem;
    }
    .track-card {
      background: var(--card-bg);
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 1rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
    }
    .track-card:hover {
      background: var(--card-hover);
      transform: translateY(-3px);
      border-color: var(--accent);
    }
    .track-card img {
      width: 65px;
      height: 65px;
      border-radius: 10px;
      object-fit: cover;
      background-color: #1e293b;
    }
    .track-meta { flex: 1; overflow: hidden; }
    .track-title { font-weight: 600; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 0.2rem; }
    .track-artist { font-size: 0.8rem; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Lyrics Display Section */
    .lyrics-container {
      display: none;
      background: var(--card-bg);
      border-radius: 20px;
      padding: 2rem;
      border: 1px solid #2d3748;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .lyrics-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2d3748;
      padding-bottom: 1.2rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .btn-group { display: flex; gap: 0.6rem; }
    .btn {
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: 0.2s;
    }
    .btn-download { background: var(--accent); color: #fff; }
    .btn-copy { background: #334155; color: #fff; }
    .btn:hover { opacity: 0.85; }

    .lyrics-text {
      white-space: pre-wrap;
      font-size: 1.05rem;
      line-height: 1.8;
      color: #e2e8f0;
      max-height: 500px;
      overflow-y: auto;
      padding-right: 0.5rem;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <header>
      <h1>Lyrics Finder</h1>
      <p>Search track, read lyrics & download clean .TXT file</p>
    </header>

    <form class="search-box" id="searchForm">
      <input type="text" id="searchInput" placeholder="Song ya Artist ka naam likho..." required>
      <button type="submit">Search</button>
    </form>

    <div class="status-box" id="statusBox">Loading...</div>

    <div class="tracks-grid" id="tracksGrid"></div>

    <div class="lyrics-container" id="lyricsBox">
      <div class="lyrics-top">
        <div>
          <h2 id="songTitle" style="font-size: 1.3rem;">Song Title</h2>
          <p id="songArtist" style="color: var(--accent); font-size: 0.9rem;">Artist</p>
        </div>
        <div class="btn-group">
          <button class="btn btn-copy" id="copyBtn">Copy Lyrics</button>
          <button class="btn btn-download" id="downloadBtn">Download .TXT</button>
        </div>
      </div>
      <div class="lyrics-text" id="lyricsText"></div>
    </div>
  </div>

  <script>
    const searchForm = document.getElementById('searchForm');
    const searchInput = document.getElementById('searchInput');
    const statusBox = document.getElementById('statusBox');
    const tracksGrid = document.getElementById('tracksGrid');
    const lyricsBox = document.getElementById('lyricsBox');
    const songTitle = document.getElementById('songTitle');
    const songArtist = document.getElementById('songArtist');
    const lyricsText = document.getElementById('lyricsText');
    const downloadBtn = document.getElementById('downloadBtn');
    const copyBtn = document.getElementById('copyBtn');

    let currentTrack = {};

    searchForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const q = searchInput.value.trim();
      if (!q) return;

      statusBox.style.display = 'block';
      statusBox.textContent = 'Songs search ho rahe hain...';
      tracksGrid.innerHTML = '';
      lyricsBox.style.display = 'none';

      try {
        // Internal proxy call (target hidden)
        const res = await fetch(`/api/search?query=${encodeURIComponent(q)}`);
        const result = await res.json();

        if (!result.success || !result.data || result.data.length === 0) {
          statusBox.textContent = 'Koi song nahi mila. Dusra search try karo.';
          return;
        }

        statusBox.style.display = 'none';
        renderTracks(result.data);
      } catch (err) {
        statusBox.textContent = 'Error aayi data load karne me.';
      }
    });

    function renderTracks(tracks) {
      tracksGrid.innerHTML = tracks.map(track => `
        <div class="track-card" onclick="getLyrics('${track.id}', '${encodeURIComponent(track.name)}', '${encodeURIComponent(track.artist)}')">
          <img src="${track.image || 'https://via.placeholder.com/150'}" alt="Cover" onerror="this.src='https://via.placeholder.com/150'"/>
          <div class="track-meta">
            <div class="track-title">${track.name}</div>
            <div class="track-artist">${track.artist}</div>
          </div>
        </div>
      `).join('');
    }

    window.getLyrics = async (id, encName, encArtist) => {
      const name = decodeURIComponent(encName);
      const artist = decodeURIComponent(encArtist);

      statusBox.style.display = 'block';
      statusBox.textContent = `"${name}" ke lyrics load ho rahe hain...`;
      lyricsBox.style.display = 'none';

      try {
        const res = await fetch(`/api/lyrics?id=${encodeURIComponent(id)}`);
        const data = await res.json();

        if (!data.success || !data.plainLyrics) {
          statusBox.textContent = 'Is song ke lyrics available nahi hain.';
          return;
        }

        statusBox.style.display = 'none';
        lyricsBox.style.display = 'block';
        songTitle.textContent = name;
        songArtist.textContent = artist;
        lyricsText.textContent = data.plainLyrics;

        currentTrack = { name, artist, lyrics: data.plainLyrics };
        lyricsBox.scrollIntoView({ behavior: 'smooth' });
      } catch (e) {
        statusBox.textContent = 'Lyrics fetch karne me dikkat hui.';
      }
    };

    downloadBtn.addEventListener('click', () => {
      if (!currentTrack.lyrics) return;
      const textData = `Song: ${currentTrack.name}\nArtist: ${currentTrack.artist}\n\n------------------------------\n\n${currentTrack.lyrics}`;
      const blob = new Blob([textData], { type: 'text/plain;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `${currentTrack.name.replace(/[/\\?%*:|"<>]/g, '_')}_Lyrics.txt`;
      link.click();
    });

    copyBtn.addEventListener('click', () => {
      if (!currentTrack.lyrics) return;
      navigator.clipboard.writeText(currentTrack.lyrics);
      alert('Lyrics copied!');
    });
  </script>
</body>
</html>
